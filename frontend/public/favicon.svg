<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Outer orbit ring -->
  <circle cx="16" cy="16" r="13" stroke="#7c3aed" stroke-width="1.5" opacity="0.55"/>
  <!-- Tilted inner orbit ellipse -->
  <ellipse cx="16" cy="16" rx="13" ry="5.5" stroke="#a78bfa" stroke-width="1.5" opacity="0.75" transform="rotate(-35 16 16)"/>
  <!-- Core glow -->
  <circle cx="16" cy="16" r="4" fill="url(#core-grad)"/>
  <!-- Orbital satellite dot -->
  <circle cx="16" cy="3.2" r="2.2" fill="#a78bfa"/>
  <defs>
    <radialGradient id="core-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
  </defs>
</svg>
